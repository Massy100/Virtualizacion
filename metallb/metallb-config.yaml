apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: parcial-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.49.240-192.168.49.240

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: parcial-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - parcial-pool