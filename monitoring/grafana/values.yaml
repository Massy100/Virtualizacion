replicas: 1

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  type: pvc
  storageClassName: standard
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring-amcr.svc.cluster.local
        isDefault: true
        editable: false

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring-amcr.svc.cluster.local
        isDefault: false
        editable: false

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring-amcr
    provider:
      name: dashboards-amcr
      folder: Proyecto Personal I
      allowUiUpdates: false