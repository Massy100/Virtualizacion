apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-amcr

configMapGenerator:
  - name: grafana-amcr-dashboards
    files:
      - metricas-cluster.json
      - logs-aplicaciones.json

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"