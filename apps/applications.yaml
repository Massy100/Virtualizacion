apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-html
  namespace: parcial-aa
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <body>
        <h1>Aplicacion 1</h1>
        <p>Servicio 1 - Kubernetes + Traefik</p>
      </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  namespace: parcial-aa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app1-html

---
apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: parcial-aa
spec:
  type: ClusterIP
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80

